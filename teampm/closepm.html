<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-control" content="no-cache , no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache , no-store">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"
        integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fastly.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" />
    <link rel="stylesheet"
        href="https://fastly.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
        }
    </style>
</head>

<body class="text-bg-dark d-flex align-items-center justify-centent-center">
    <main>
        <div class="container-fluid">
            <form id="mainform" class="row justify-content-center g-3">
                <div class="col-md-4">
                    <label for="code">รหัสเครื่อง (ใส่คอมม่าคั้น)</label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="รหัสเครื่อง">
                </div>
                <div class="col-md-4">
                    <label for="vender">Vender</label>
                    <select name="vender" id="vender" class="form-select">
                        <option value="" selected disabled>เลือก vendor</option>
                      
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="date">วันที่</label>
                    <input type="date" class="form-control" id="date" name="date">
                </div>
                <div class="col-md-4">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="" id="safety" name="safety">
                        <label class="form-check-label" for="safety">
                            Electrical Safety Analyzer
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="" id="is_pm" name="is_pm" checked>
                        <label class="form-check-label" for="is_pm">
                            Close PM
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="" id="is_cal" name="is_cal">
                        <label class="form-check-label" for="is_cal">
                            Close CAL
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="is_team_cal" name="is_team_cal">
                        <label class="form-check-label" for="is_cal">
                            Team CAL
                        </label>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <button class="btn btn-primary w-100" type="submit">ตกลง</button>
                </div>

            </form>
        </div>
    </main>
    <script>
        $(document).ready(function () {
            const liff_id = '1657539607-0RQnQ4zW'
            liff.init({
                liffId: liff_id,
                withLoginOnExternalBrowser: true
            })
            liff.ready.then(async () => {
                const venderSelect = document.getElementById('vender')

                try {
                    const response = await fetch('https://bursting-fox-mostly.ngrok-free.app/get_emp', {
                        headers: { Accept: 'application/json', 'ngrok-skip-browser-warning': 'true' },
                        cache: 'no-store'
                    })

                    if (!response.ok) {
                        throw new Error(`get_emp returned ${response.status}`)
                    }

                    const payload = await response.json()
                    const responseData = Array.isArray(payload)
                        ? payload
                        : payload.data || payload.employees || payload.results || []
                    const records = Array.isArray(responseData)
                        ? responseData
                        : Object.values(responseData || {})
                    const names = records
                        .map((record) => {
                            if (typeof record === 'string' || typeof record === 'number') {
                                return String(record).trim()
                            }

                            return String(
                                record?.name ||
                                record?.vender ||
                                record?.vendor ||
                                record?.company_name ||
                                record?.employee_name ||
                                record?.VENDER ||
                                record?.VENDOR ||
                                record?.COMPANY_NAME ||
                                record?.EMPLOYEE_NAME ||
                                ''
                            ).trim()
                        })
                        .filter(Boolean)
                        .filter((name, index, list) => list.indexOf(name) === index)
                        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))

                    names.forEach((name) => {
                        if (!Array.from(venderSelect.options).some((option) => option.text.trim() === name)) {
                            venderSelect.add(new Option(name, name))
                        }
                    })
                } catch (error) {
                    console.error('Unable to load vender data:', error)
                }

                $('#vender').select2({
                    theme: 'bootstrap-5',
                    width: '100%',
                    closeOnSelect: true,
                    tags: true,
                }).on('select2:selecting', function (e) {
                    let inputValue = e.params.args.data.text;
                    let optionValue = inputValue.toLowerCase().replace(/\s+/g, '-');

                    // Create a new option element
                    let newOption = new Option(inputValue, optionValue, true, true);

                    // Append the new option to the select element
                    $(this).append(newOption).trigger('change');
                });
                $(document).on('select2:open', () => {
                    document.querySelector('.select2-search__field').focus();
                });
            })
        })
        $('#mainform').submit(async function (e) {
            e.preventDefault()
            let code = $('#code').val().replace(/ |,|\n/g, ',').split(',').map(c => c.trim()).filter(c => c != '')
            let vender = $('#vender').val()
            let date = $('#date').val()
            let safety = $('#safety').is(':checked') ? 'safety' : undefined
            let close_pm = $('#is_pm').is(':checked')
            let close_cal = $('#is_cal').is(':checked')
            date = date.split('-').reverse().join('/')
            
            if ((vender == null || vender == '') && !$('#is_team_cal').is(':checked')) {
                return Swal.fire({
                    title: 'กรุณาเลือก Vender',
                    icon: 'error',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    setTimeout(() => {
                        $('#vender').select2('open')
                    }, 1000);
                })
            }
            if (!close_pm && !close_cal) {
                return Swal.fire({
                    title: 'กรุณาเลือกประเภทการปิดงาน',
                    icon: 'error',
                    showConfirmButton: false,
                    timer: 1500
                })
            }
            if ($('#is_team_cal').is(':checked')) {
                vender = '[[CAL]]'
            }else{
                vender = vender.split(',')[0]
            }
            for (let c of code) {
                Swal.fire({
                    title: c,
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading()
                    }
                })
                let mode = close_pm && close_cal ? 'closepmcal' : close_pm ? 'closepm' : 'closecal'
                let msg = mode + '=' + c + ',' + vender  //+ ',' + date + ',' + safety
                if (date != null && date != '') {
                    msg += ',' + date
                }
                if (safety != null && safety != '') {
                    msg += ',' + safety
                }
                // await new Promise((resolve, reject) => setTimeout(() => resolve(), 200)).then(() => {
                //     liff.sendMessages([{
                //         'type': 'text',
                //         'text': msg
                //     }]).then(() => {
                //         console.log('message sent')
                //     }).catch((err) => {
                //         console.log('error', err)
                //     })
                //     // $('body').append(msg + '<br>')
                // })
                await liff.sendMessages([{
                    'type': 'text',
                    'text': msg
                }])
                await new Promise((resolve, reject) => setTimeout(() => resolve(), 1000))
                if (c == code[code.length - 1]) {
                    Swal.fire({
                        title: 'เสร็จสิ้น',
                        icon: 'success',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        liff.closeWindow()
                    })
                }
            }
        })
    </script>

</body>
