<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily check scancode</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
        :root {
            --loader-blue: #2563eb;
            --loader-blue-dark: #1e40af;
        }

        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: rgba(239, 246, 255, 0.96);
            color: var(--loader-blue-dark);
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        #app-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            display: grid;
            justify-items: center;
            gap: 14px;
            padding: 24px;
            text-align: center;
            font: 600 15px/1.5 system-ui, sans-serif;
        }

        .loader-spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #bfdbfe;
            border-top-color: var(--loader-blue);
            border-radius: 50%;
            animation: loader-spin 0.8s linear infinite;
        }

        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #app-loader { transition: none; }
            .loader-spinner { animation-duration: 1.6s; }
        }
    </style>

</head>

<body>
    <div id="app-loader" role="status" aria-live="polite" aria-label="กำลังโหลด">
        <div class="loader-content">
            <div class="loader-spinner" aria-hidden="true"></div>
            <div>กำลังเตรียมระบบสแกน...</div>
        </div>
    </div>
    <script>
        document.write('<script defer src="../js/scancode.js?cache=' + new Date().getTime() + '"><\/script>')
    </script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        // VConsole will be exported to `window.VConsole` by default.
        var vConsole = new window.VConsole();
    </script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
