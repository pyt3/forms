<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF8604">
  <title>ลงชื่อรับเครื่องมือแพทย์ | Team Pool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Mitr', 'Tahoma', 'sans-serif'] },
          colors: { orange: { 950: '#7c2d12' } }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@0.468.0"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/moment@2.30.1/min/moment-with-locales.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    :root {
      color-scheme: light;
      --brand: #ea580c;
      --brand-dark: #9a3412;
      --page-bg: #fff7ed;
      --ink: #0f172a;
      --surface: #ffffff;
    }

    body {
      background: var(--page-bg);
      font-family: 'Mitr', sans-serif;
    }

    body::before {
      content: none;
    }

    header {
      position: relative;
      z-index: 1;
      background: var(--surface) !important;
    }

    main {
      position: relative;
      z-index: 1;
    }

    .surface {
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, .08);
    }

    .borrow-signature-alert {
      border-radius: 1rem !important;
    }

    .order-row {
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .order-row:hover {
      transform: translateY(-1px);
    }

    .order-row.is-selected {
      border-color: #FF8604;
      background: #fff7ed;
    }

    .signature-wrap {
      touch-action: none;
    }

    #signatureCanvas {
      width: 100%;
      height: 220px;
      display: block;
      cursor: crosshair;
    }

    .signature-locked #signatureCanvas {
      cursor: not-allowed;
      opacity: .8;
      pointer-events: none;
    }

    .signature-locked .signature-wrap {
      touch-action: pan-y;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    .modal-backdrop {
      background: rgba(7, 29, 29, .66);
      overscroll-behavior: contain;
    }

    .signature-modal-panel {
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }

    #signatureModalContent,
    #signForm {
      min-height: 0;
    }

    #signatureModalContent {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
    }

    #signatureModalContent.hidden {
      display: none;
    }

    #signForm {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
    }

    .signature-modal-body {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .signature-modal-footer {
      flex-shrink: 0;
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    @media (max-width: 640px) {
      .signature-modal-panel {
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      #signatureCanvas {
        height: 190px;
      }
    }
  </style>
</head>

            <div class="flex items-center gap-4 rounded-xl px-3 py-4 sm:px-4"><div class="h-10 w-10 shrink-0 rounded-lg bg-slate-200"></div><div class="min-w-0 flex-1 space-y-2"><div class="h-4 w-1/2 rounded bg-slate-200"></div><div class="h-3 w-2/3 rounded bg-slate-100"></div><div class="h-3 w-1/4 rounded bg-slate-100"></div></div><div class="w-20 space-y-2"><div class="ml-auto h-4 w-16 rounded bg-slate-200"></div><div class="ml-auto h-3 w-12 rounded bg-slate-100"></div></div></div>

  <div id="toast"
    class="pointer-events-none fixed bottom-5 left-1/2 z-[60] hidden -translate-x-1/2 rounded-lg bg-slate-950 px-4 py-3 text-sm text-white shadow-lg"
    role="status"></div>

  <script>
    const BORROW_API = 'https://script.google.com/macros/s/AKfycbxG4JJ2Y2tHvmA-sBOF0voSGzQq4Fx1Q1j10HqGq1duL4eX53s248A4llUDY8GE7bO1/exec?mode=getborroworderno';
    const FIREBASE_CONFIG_API = 'https://script.google.com/macros/s/AKfycbxZYaHtDIQIS46gUnAfD6jho5CJwNmgS0KjIyIIqHjOhqbvleQfVRIg71Q36GxQM5Xb/exec?project=pool-job';
    const SIGNATURE_COLLECTION = 'borrow_signatures';
    const FIREBASE_TIMEOUT_MS = 20000;
    let orders = [], selected = null, signaturePad = null, firestore = null, auth = null, firebaseReady = null;
    let signatureCheckToken = 0, signatureLocked = false, signatureChecking = false, signaturePadInteractive = false, previousFocusedElement = null;
    let currentPage = 0, isLoadingMore = false;

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' })[char]);
    const unique = (values) => [...new Set(values.filter(Boolean))];
    function initializeLocale() { moment.locale('th'); }

    function withTimeout(promise, message, timeout = FIREBASE_TIMEOUT_MS) {
      let timer;
      const timeoutPromise = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), timeout);
      });
      return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timer));
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function withRetry(task, attempts = 2) {
      let lastError;
      for (let attempt = 0; attempt < attempts; attempt += 1) {
        try {
          return await task();
        } catch (error) {
          lastError = error;
          if (attempt < attempts - 1) await wait(400);
        }
      }
      throw lastError;
    }

    function waitForAuthState(authInstance) {
      return new Promise(resolve => {
        let unsubscribe = () => {};
        unsubscribe = authInstance.onAuthStateChanged(user => {
          unsubscribe();
          resolve(user);
        });
      });
    }

    function formatBorrowDate(value) {
      const parsed = moment(value, ['DD/MM/YYYY H:mm', 'DD/MM/YYYY HH:mm'], true);
      if (!parsed.isValid()) return { exact: value || 'ไม่ระบุวันที่ยืม', relative: '' };
      return { exact: parsed.format('DD/MM/YYYY HH:mm'), relative: parsed.fromNow() };
    }

    function orderDetails(orderNo, rows) {
      const departments = unique(rows.map(row => row.dept));
      const types = unique(rows.map(row => row.type));
      const borrowDate = rows.find(row => row.borrow_date)?.borrow_date || '';
      return { orderNo, rows, count: rows.length, departments, types, borrowDate };
    }

    function renderOrderSkeleton(count = 5) {
      const widths = ['w-2/5', 'w-1/2', 'w-1/3', 'w-3/5', 'w-2/5'];
      $('#orderList').innerHTML = `<div class="animate-pulse space-y-2 p-1" aria-label="กำลังโหลดรายการใบยืม">${Array.from({ length: count }, (_, index) => `
        <div class="flex items-center gap-4 rounded-xl px-3 py-4 sm:px-4"><div class="h-10 w-10 shrink-0 rounded-lg bg-slate-200"></div><div class="min-w-0 flex-1 space-y-2"><div class="h-4 ${widths[index % widths.length]} rounded bg-slate-200"></div><div class="h-3 w-3/5 rounded bg-slate-100"></div><div class="h-3 w-1/4 rounded bg-slate-100"></div></div><div class="w-20 space-y-2"><div class="ml-auto h-4 w-16 rounded bg-slate-200"></div><div class="ml-auto h-3 w-12 rounded bg-slate-100"></div></div></div>`).join('')}</div>`;
    }

    function renderOrders(query = '') {
      const normalized = query.trim().toLowerCase();
      const visible = orders.filter(order => [order.orderNo, ...order.departments, ...order.types].join(' ').toLowerCase().includes(normalized));
      $('#listSummary').textContent = `${visible.length} งานที่เลือกได้จากทั้งหมด ${orders.length} งาน`;
      if (!visible.length) { $('#orderList').innerHTML = '<div class="px-4 py-10 text-center text-sm text-slate-500">ไม่พบ borrow order ที่ตรงกับคำค้น</div>'; return; }
      $('#orderList').innerHTML = visible.map(order => `
        ${(() => {
          const date = formatBorrowDate(order.borrowDate); return `
        <button type="button" class="order-row flex w-full items-center gap-4 rounded-xl border border-transparent px-3 py-4 text-left hover:bg-slate-50 sm:px-4" data-order="${escapeHtml(order.orderNo)}">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-orange-50 text-orange-700"><i data-lucide="package-check" class="h-5 w-5"></i></span>
          <span class="min-w-0 flex-1"><span class="block truncate text-base font-semibold text-slate-700">${escapeHtml(order.departments.join(' · ') || 'ไม่ระบุหน่วยงาน')}</span><span class="mt-1 block text-xs text-slate-500"><i data-lucide="calendar-clock" class="mr-1 inline h-3.5 w-3.5 align-[-2px] text-orange-600"></i>ยืม ${escapeHtml(date.exact)}${date.relative ? ` · ${escapeHtml(date.relative)}` : ''}</span><span class="mt-1 block font-mono text-xs text-slate-400">${escapeHtml(order.orderNo)}</span></span>
          <span class="shrink-0 text-right"><span class="block text-sm font-semibold text-slate-700">${order.count} รายการ</span><span class="mt-1 block text-xs text-slate-400">เซ็นชื่อ <i data-lucide="arrow-right" class="inline h-3.5 w-3.5 align-[-2px]"></i></span></span>
        </button>`;
        })()}`).join('');
      document.querySelectorAll('[data-order]').forEach(button => button.addEventListener('click', () => openSignModal(orders.find(order => order.orderNo === button.dataset.order))));
      lucide.createIcons();
    }

    function setLoadMoreState(isLoading) {
      const button = $('#loadMoreButton');
      button.disabled = isLoading;
      button.innerHTML = isLoading
        ? '<i data-lucide="loader-circle" class="h-4 w-4 animate-spin"></i><span>กำลังโหลด...</span>'
        : '<i data-lucide="chevron-down" class="h-4 w-4"></i><span>เพิ่มเติม</span>';
      lucide.createIcons();
    }

    async function loadOrders(page = 1, append = false) {
      if (append && isLoadingMore) return;
      if (append) { isLoadingMore = true; setLoadMoreState(true); }
      if (!append) {
        orders = [];
        $('#orderList').setAttribute('aria-busy', 'true');
        $('#searchInput').disabled = true;
        $('#listSummary').textContent = 'กำลังโหลดรายการ...';
        renderOrderSkeleton();
      }
      try {
        const endpoint = new URL(BORROW_API, window.location.href);
        endpoint.searchParams.set('page', String(page));
        const response = await fetch(endpoint, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (payload.status && payload.status !== 'ok') throw new Error('API status is not ok');
        const rows = payload.rows || {};
        const newOrders = Object.entries(rows).map(([orderNo, items]) => orderDetails(orderNo, Array.isArray(items) ? items : []));
        if (append) {
          const orderMap = new Map(orders.map(order => [order.orderNo, order]));
          newOrders.forEach(order => {
            const existing = orderMap.get(order.orderNo);
            orderMap.set(order.orderNo, existing ? orderDetails(order.orderNo, [...existing.rows, ...order.rows]) : order);
          });
          orders = [...orderMap.values()];
        } else {
          orders = newOrders;
        }
        orders.sort((a, b) => Number(b.orderNo) - Number(a.orderNo));
        currentPage = page;
        $('#searchInput').disabled = orders.length === 0;
        renderOrders($('#searchInput').value);
        $('#orderList').setAttribute('aria-busy', 'false');
        $('#loadMoreButton').classList.toggle('hidden', newOrders.length === 0);
      } catch (error) {
        console.error('load borrow orders:', error);
        if (!append) {
          $('#listSummary').textContent = 'ไม่สามารถโหลดรายการได้';
          $('#orderList').innerHTML = '<div class="px-4 py-10 text-center"><i data-lucide="wifi-off" class="mx-auto mb-3 h-7 w-7 text-rose-500"></i><p class="text-sm font-medium text-slate-700">โหลดรายการ borrow order ไม่สำเร็จ</p><p class="mt-1 text-xs text-slate-500">กรุณาตรวจสอบการเชื่อมต่อแล้วรีเฟรชหน้าเว็บ</p></div>';
          lucide.createIcons();
        } else {
          showToast('โหลดข้อมูลเพิ่มเติมไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
        }
      } finally {
        if (!append) $('#orderList').setAttribute('aria-busy', 'false');
        if (append) { isLoadingMore = false; setLoadMoreState(false); }
      }
    }

    async function initFirebase() {
      if (firebaseReady) return firebaseReady;
      firebaseReady = (async () => {
        const config = await withTimeout(
          fetch(FIREBASE_CONFIG_API, { cache: 'no-store' }).then(response => {
            if (!response.ok) throw new Error(`โหลด Firebase config ไม่สำเร็จ (HTTP ${response.status})`);
            return response.json();
          }),
          'โหลดระบบบันทึกนานเกินไป กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'
        );
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
        firestore = app.firestore();
        // ช่วยให้ Firestore ใช้งานได้ในเครือข่ายที่บล็อก WebSocket/HTTP2
        firestore.settings({ experimentalAutoDetectLongPolling: true });
        auth = app.auth();
        try {
          const restoredUser = await withTimeout(
            waitForAuthState(auth),
            'เตรียมระบบยืนยันตัวตนนานเกินไป กรุณาลองใหม่'
          );
          if (!restoredUser) {
            await withTimeout(
              withRetry(() => auth.signInAnonymously(), 2),
              'เข้าสู่ระบบบันทึกนานเกินไป กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'
            );
          }
        } catch (error) {
          if (error.code === 'auth/operation-not-allowed') {
            throw new Error('ยังไม่ได้เปิด Firebase Anonymous Authentication กรุณาเปิดผู้ให้บริการ Anonymous ใน Firebase Console');
          }
          throw error;
        }
      })().catch(error => {
        firebaseReady = null;
        throw error;
      });
      return firebaseReady;
    }

    function resizeCanvas() {
      if (!signaturePad) return;
      const canvas = $('#signatureCanvas'), ratio = Math.max(window.devicePixelRatio || 1, 1), rect = canvas.getBoundingClientRect();
      const data = signaturePad.isEmpty() ? null : signaturePad.toData();
      canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
      canvas.getContext('2d').scale(ratio, ratio);
      signaturePad.clear(); if (data) signaturePad.fromData(data);
    }

    function setSignatureStatus(message = '', state = 'info') {
      const status = $('#signatureStatus');
      status.textContent = message;
      status.className = message
        ? `mb-2 rounded-lg px-3 py-2 text-sm ${state === 'success' ? 'bg-emerald-50 text-emerald-800' : state === 'loading' ? 'bg-slate-50 text-slate-700' : state === 'info' ? 'bg-orange-50 text-orange-800' : 'bg-rose-50 text-rose-800'}`
        : 'mb-2 hidden rounded-lg px-3 py-2 text-sm';
    }

    function setSignatureLocked(locked) {
      signatureLocked = locked;
      $('#signForm').classList.toggle('signature-locked', locked);
      $('#clearSignature').disabled = locked;
      $('#submitButton').disabled = locked || signatureChecking;
      $('#receiverName').disabled = locked || signatureChecking;
      $('#signatureCanvas').setAttribute('aria-disabled', String(locked));
      syncSignaturePadInteractivity();
    }

    function setSignatureChecking(checking) {
      signatureChecking = checking;
      $('#signModal').setAttribute('aria-busy', String(checking));
      const loader = $('#signatureCheckLoader');
      const content = $('#signatureModalContent');
      loader.classList.toggle('hidden', !checking);
      content.classList.toggle('hidden', checking);
      loader.style.display = checking ? 'block' : 'none';
      loader.setAttribute('aria-hidden', String(!checking));
      if (checking) loader.focus();
      $('#receiverName').disabled = checking || signatureLocked;
      $('#submitButton').disabled = checking || signatureLocked;
      syncSignaturePadInteractivity();
      if (checking) lucide.createIcons();
    }

    function trapModalFocus(event) {
      if (event.key !== 'Tab' || $('#signModal').classList.contains('hidden')) return;
      const focusable = [...$('#signModal').querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])')];
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function prepareSignaturePad() {
      if (!signaturePad) {
        signaturePad = new SignaturePad($('#signatureCanvas'), { penColor: '#123a63', minWidth: 0.8, maxWidth: 2.3 });
        signaturePadInteractive = true;
      }
      resizeCanvas();
      signaturePad.clear();
      syncSignaturePadInteractivity();
      return signaturePad;
    }

    function syncSignaturePadInteractivity() {
      if (!signaturePad) return;
      const shouldBeInteractive = !signatureLocked && !signatureChecking;
      if (shouldBeInteractive === signaturePadInteractive) return;
      if (shouldBeInteractive) signaturePad.on();
      else signaturePad.off();
      signaturePadInteractive = shouldBeInteractive;
    }

    function fitSignatureToCanvas(vectorPath, sourceCanvas) {
      const sourceWidth = Number(sourceCanvas?.width);
      const sourceHeight = Number(sourceCanvas?.height);
      const targetWidth = $('#signatureCanvas').clientWidth;
      const targetHeight = $('#signatureCanvas').clientHeight;
      if (!sourceWidth || !sourceHeight || !targetWidth || !targetHeight) return vectorPath;
      const scaleX = targetWidth / sourceWidth;
      const scaleY = targetHeight / sourceHeight;
      if (Math.abs(scaleX - 1) < 0.001 && Math.abs(scaleY - 1) < 0.001) return vectorPath;
      return vectorPath.map(group => ({
        ...group,
        points: (group.points || []).map(point => ({
          ...point,
          x: point.x * scaleX,
          y: point.y * scaleY
        }))
      }));
    }

    function waitForSignaturePad(token = signatureCheckToken) {
      return new Promise(resolve => requestAnimationFrame(() => {
        resolve(token === signatureCheckToken ? prepareSignaturePad() : null);
      }));
    }

    function renderSelectedOrder(order) {
      $('#selectedOrder').textContent = order.orderNo;
      $('#selectedMeta').textContent = `${order.count} รายการ · ${order.departments.join(' · ') || 'ไม่ระบุหน่วยงาน'}`;
      $('#selectedItems').innerHTML = order.rows.length
        ? order.rows.map(row => `<tr><td class="px-4 py-3 text-slate-700">${escapeHtml(row.type || '-')}</td><td class="px-4 py-3 font-mono text-sm font-medium text-slate-700">${escapeHtml(row.item_code || '-')}</td></tr>`).join('')
        : '<tr><td colspan="2" class="px-4 py-5 text-center text-sm text-slate-500">ไม่พบรายการเครื่องมือ</td></tr>';
    }

    async function checkExistingSignature(order, token) {
      try {
        setSignatureStatus('กำลังตรวจสอบสถานะการเซ็นชื่อ...', 'loading');
        await initFirebase();
        const snapshot = await withTimeout(
          firestore.collection(SIGNATURE_COLLECTION).doc(String(order.orderNo)).get(),
          'ตรวจสอบสถานะการเซ็นชื่อนานเกินไป กรุณาลองใหม่'
        );
        if (token !== signatureCheckToken || selected !== order) return;

        const data = snapshot.exists ? snapshot.data() : null;
        const vectorPath = data?.signature?.vectorPath;
        if (!snapshot.exists || !Array.isArray(vectorPath) || !vectorPath.length) {
          setSignatureChecking(false);
          setSignatureLocked(false);
          renderSelectedOrder(order);
          setSignatureStatus('ยังไม่มีลายเซ็น', 'info');
          const pad = await waitForSignaturePad(token);
          if (pad && token === signatureCheckToken && selected === order) $('#receiverName').focus();
          return;
        }

        $('#receiverName').value = data.receiverName || '';
        setSignatureChecking(false);
        setSignatureLocked(true);
        renderSelectedOrder(order);
        const pad = await waitForSignaturePad(token);
        if (token !== signatureCheckToken || selected !== order) return;
        if (!pad) return;
        pad.fromData(fitSignatureToCanvas(vectorPath, data.signature.canvas));
        setSignatureStatus('รายการนี้เซ็นแล้ว ไม่สามารถแก้ไขลายเซ็นได้', 'success');
        await Swal.fire({
          icon: 'info',
          title: 'รายการนี้เซ็นแล้ว',
          confirmButtonText: 'รับทราบ',
          confirmButtonColor: '#ea580c',
          customClass: { popup: 'borrow-signature-alert' }
        });
      } catch (error) {
        if (token !== signatureCheckToken || selected !== order) return;
        setSignatureChecking(false);
        setSignatureLocked(true);
        setSignatureStatus('ตรวจสอบสถานะการเซ็นชื่อไม่สำเร็จ กรุณาลองใหม่', 'error');
        showError(error.message || 'ตรวจสอบสถานะการเซ็นชื่อไม่สำเร็จ');
      }
    }

    function openSignModal(order) {
      const token = ++signatureCheckToken;
      selected = order;
      setSignatureChecking(true);
      setSignatureLocked(true);
      setSignatureStatus('กำลังตรวจสอบสถานะการเซ็นชื่อ...', 'loading');
      $('#selectedOrder').textContent = '';
      $('#selectedMeta').textContent = '';
      $('#selectedItems').innerHTML = '';
      $('#receiverName').value = '';
      $('#formError').classList.add('hidden');
      $('#signModal').classList.remove('hidden'); $('#signModal').classList.add('flex');
      document.body.classList.add('overflow-hidden');
      previousFocusedElement = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      $('#signatureCheckLoader').focus();
      checkExistingSignature(order, token);
    }

    function closeModal() {
      ++signatureCheckToken;
      setSignatureChecking(false);
      $('#signModal').classList.add('hidden'); $('#signModal').classList.remove('flex');
      document.body.classList.remove('overflow-hidden');
      selected = null; setSignatureLocked(false);
      if (previousFocusedElement && document.contains(previousFocusedElement)) previousFocusedElement.focus();
      previousFocusedElement = null;
    }
    function showError(message) { $('#formError').textContent = message; $('#formError').classList.remove('hidden'); }
    function showToast(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3600); }

    async function saveSignature(event) {
      event.preventDefault();
      if (!selected) return;
      if (signatureLocked) { showError('รายการนี้เซ็นแล้ว ไม่สามารถบันทึกซ้ำได้'); return; }
      const receiverName = $('#receiverName').value.trim();
      if (!receiverName) { showError('กรุณาพิมพ์ชื่อผู้รับเครื่องมือ'); $('#receiverName').focus(); return; }
      if (!signaturePad || signaturePad.isEmpty()) { showError('กรุณาเซ็นชื่อในกรอบก่อนยืนยัน'); return; }
      const button = $('#submitButton'); button.disabled = true; button.querySelector('span').textContent = 'กำลังบันทึก...'; $('#formError').classList.add('hidden');
      try {
        await initFirebase();
        const savedOrderNo = String(selected.orderNo);
        const vectorPath = signaturePad.toData();
        await withTimeout(firestore.collection(SIGNATURE_COLLECTION).doc(String(selected.orderNo)).set({
          borrowOrderNo: String(selected.orderNo),
          receiverName,
          dept: unique(selected.rows.map(row => row.dept)).join(', '),
          borrowDate: unique(selected.rows.map(row => row.borrow_date)).join(', '),
          signature: { vectorPath, canvas: { width: $('#signatureCanvas').clientWidth, height: $('#signatureCanvas').clientHeight, penColor: '#123a63' } },
          items: selected.rows.map(row => {
            return { type: row.type ?? '', code: row.item_code ?? row.code ?? '' }
          }),
          site: 'PYT3',
          signedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }), 'บันทึกนานเกินไป กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
        closeModal(); showToast(`บันทึกการรับเครื่อง ${savedOrderNo} เรียบร้อยแล้ว`); renderOrders($('#searchInput').value);
      } catch (error) {
        console.error('save signature:', error);
        const code = error.code ? ` [${error.code}]` : '';
        showError(`${error.message || 'บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'}${code}`);
      }
      finally { button.disabled = false; button.querySelector('span').textContent = 'ยืนยันการรับเครื่อง'; }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initializeLocale();
      lucide.createIcons(); loadOrders();
      $('#searchInput').addEventListener('input', event => renderOrders(event.target.value));
      $('#loadMoreButton').addEventListener('click', () => loadOrders(currentPage + 1, true));
      $('#signForm').addEventListener('submit', saveSignature); $('#clearSignature').addEventListener('click', () => signaturePad?.clear());
      $('#closeModal').addEventListener('click', closeModal);
      $('#signModal').addEventListener('click', event => { if (event.target === $('#signModal')) closeModal(); });
      window.addEventListener('resize', resizeCanvas);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !$('#signModal').classList.contains('hidden')) closeModal();
        trapModalFocus(event);
      });
    });
  </script>
</body>
